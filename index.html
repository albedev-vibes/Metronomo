<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronomo Batucada Multi-Screen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #setup-interface {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 90%;
            text-align: center;
            z-index: 10;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        button:hover { background: #007c82; }

        /* Schermata Flash */
        #flash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #info-overlay {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }
        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            font-size: 0.8rem;
            width: auto;
        }
    </style>
</head>
<body>

    <!-- INTERFACCIA DI CONFIGURAZIONE -->
    <div id="setup-interface">
        <h2>Configurazione</h2>

        <div class="control-group">
            <label>Ruolo di questo Telefono:</label>
            <select id="phone-id" onchange="checkRole()">
                <option value="regia">REGIA (Imposta i comandi)</option>
                <option value="1">Telefono 1 (Primo Beat - Accento)</option>
                <option value="2">Telefono 2</option>
                <option value="3">Telefono 3</option>
                <option value="4">Telefono 4</option>
            </select>
        </div>

        <div id="regia-controls">
            <div class="control-group">
                <label>Tempo (Numeratore):</label>
                <input type="number" id="time-num" value="4" min="1" max="16">
            </div>

            <div class="control-group">
                <label>BPM (Velocità):</label>
                <input type="number" id="bpm" value="120" min="40" max="300">
            </div>

            <div class="control-group">
                <label>Numero totale Telefoni in uso:</label>
                <input type="number" id="total-phones" value="2" min="1" max="10">
            </div>
        </div>

        <div class="control-group">
            <label>Calibrazione Sync (ms +/-):</label>
            <input type="number" id="sync-offset" value="0" step="50">
        </div>

        <button onclick="startMetronome()">AVVIA METRONOMO</button>
    </div>

    <!-- SCHERMATA DI LAMPEGGIAMENTO -->
    <div id="flash-screen">
        <button class="back-btn" onclick="stopMetronome()">⚙ Esci</button>
        <div id="info-overlay">Attendendo il tempo...</div>
    </div>

    <script>
        let animationFrameId;
        let isRunning = false;

        function checkRole() {
            const role = document.getElementById('phone-id').value;
            const regiaControls = document.getElementById('regia-controls');
            regiaControls.style.display = (role === 'regia') ? 'block' : 'none';
        }

        function startMetronome() {
            const role = document.getElementById('phone-id').value;

            if (role === 'regia') {
                alert("Imposta questo telefono come 'Telefono 1', 'Telefono 2' ecc. La Regia serve solo per definire i parametri.");
                return;
            }

            const currentPhone = parseInt(role);
            const num = parseInt(document.getElementById('time-num').value);
            const bpm = parseInt(document.getElementById('bpm').value);
            const totalPhones = parseInt(document.getElementById('total-phones').value);
            const syncOffset = parseInt(document.getElementById('sync-offset').value) || 0;

            document.getElementById('setup-interface').style.display = 'none';
            const flashScreen = document.getElementById('flash-screen');
            flashScreen.style.display = 'flex';
            flashScreen.style.backgroundColor = '#111';

            const beatDuration = (60 / bpm) * 1000;
            isRunning = true;

            function updateLoop() {
                if (!isRunning) return;

                // Calcolo tempo sincronizzato con aggiunta dell'offset manuale
                const now = Date.now() + syncOffset;
                const absoluteBeat = Math.floor(now / beatDuration);
                const currentBeatInMeasure = (absoluteBeat % num) + 1;

                let targetPhone = currentBeatInMeasure;
                if (currentBeatInMeasure > totalPhones) {
                    targetPhone = totalPhones;
                }

                // Determina la fase del battito corrente (da 0.0 a 1.0)
                const timeInCurrentBeat = now % beatDuration;
                const isFlashActive = timeInCurrentBeat < (beatDuration * 0.3); // Flash per il primo 30% del battito

                if (currentPhone === targetPhone && currentPhone <= totalPhones && isFlashActive) {
                    flashScreen.style.backgroundColor = (currentBeatInMeasure === 1) ? '#ff0055' : '#ffcc00';
                    document.getElementById('info-overlay').innerHTML = `BEAT: ${currentBeatInMeasure}<br>TELEFONO: ${currentPhone}`;
                } else {
                    flashScreen.style.backgroundColor = '#111';
                    document.getElementById('info-overlay').innerHTML = `...<br><span style="font-size:1rem; color:#444;">In attesa del Beat</span>`;
                }

                animationFrameId = requestAnimationFrame(updateLoop);
            }

            animationFrameId = requestAnimationFrame(updateLoop);
        }

        function stopMetronome() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('flash-screen').style.display = 'none';
            document.getElementById('setup-interface').style.display = 'block';
        }
    </script>
</body>
</html>
