<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronomo Batucada Multi-Screen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #setup-interface {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 90%;
            text-align: center;
            z-index: 10;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        button:hover { background: #007c82; }

        /* Schermata Flash */
        #flash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #info-overlay {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }
        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            font-size: 1rem;
            width: auto;
            color: white;
            border: 1px solid #666;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- INTERFACCIA DI CONFIGURAZIONE -->
    <div id="setup-interface">
        <h2>Configurazione</h2>

        <div class="control-group">
            <label>Ruolo del dispositivo:</label>
            <select id="phone-id" onchange="checkRole()">
                <option value="1">Dispositivo 1</option>
                <option value="2">Dispositivo 2</option>
                <option value="3">Dispositivo 3</option>
                <option value="4">Dispositivo 4</option>
                <option value="regia">REGIA (Solo parametri)</option>
            </select>
        </div>

        <div id="regia-controls">
            <div class="control-group">
                <label>Tempo (Battiti per misura):</label>
                <input type="number" id="time-num" value="4" min="1" max="16">
            </div>

            <div class="control-group">
                <label>BPM (Velocità):</label>
                <input type="number" id="bpm" value="120" min="40" max="300">
            </div>

            <div class="control-group">
                <label>Numero totale Dispositivi in uso:</label>
                <input type="number" id="total-phones" value="4" min="1" max="10">
            </div>
        </div>

        <div class="control-group">
            <label>Calibrazione Sync (ms +/-):</label>
            <input type="number" id="sync-offset" value="0" step="10">
        </div>

        <button onclick="startMetronome()">AVVIA METRONOMO</button>
    </div>

    <!-- SCHERMATA DI LAMPEGGIAMENTO -->
    <div id="flash-screen">
        <button class="back-btn" onclick="stopMetronome()">⚙ Esci / Stop</button>
        <div id="info-overlay">Inizializzazione...</div>
    </div>

    <script>
        let animationFrameId;
        let isRunning = false;
        let audioCtx = null;

        // Riproduce un Click acustico tramite Web Audio API
        function playClick(pitch = 800) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                console.log("Audio non supportato:", e);
            }
        }

        function checkRole() {
            const role = document.getElementById('phone-id').value;
            const regiaControls = document.getElementById('regia-controls');
            regiaControls.style.display = 'block';
        }

        function startMetronome() {
            const role = document.getElementById('phone-id').value;

            if (role === 'regia') {
                alert("Imposta questo dispositivo come 'Dispositivo 1', '2', '3' ecc. per vedere i flash visivi.");
                return;
            }

            const currentPhone = parseInt(role);
            const num = parseInt(document.getElementById('time-num').value);
            const bpm = parseInt(document.getElementById('bpm').value);
            const totalPhones = parseInt(document.getElementById('total-phones').value);
            const syncOffset = parseInt(document.getElementById('sync-offset').value) || 0;

            document.getElementById('setup-interface').style.display = 'none';
            const flashScreen = document.getElementById('flash-screen');
            flashScreen.style.display = 'flex';
            flashScreen.style.backgroundColor = '#111';

            const beatDuration = (60 / bpm) * 1000;
            isRunning = true;
            let lastBeatPlayed = -1;

            function updateLoop() {
                if (!isRunning) return;

                const now = Date.now() + syncOffset;
                const absoluteBeat = Math.floor(now / beatDuration);
                
                // Beat corrente della misura (es. da 1 a 4)
                const currentBeatInMeasure = (absoluteBeat % num) + 1;

                // Rotazione sequenziale completa tra tutti i dispositivi
                const targetPhone = (absoluteBeat % totalPhones) + 1;

                const timeInCurrentBeat = now % beatDuration;
                const isFlashActive = timeInCurrentBeat < (beatDuration * 0.35);

                if (currentPhone === targetPhone && isFlashActive) {
                    const isFirstBeat = (currentBeatInMeasure === 1);
                    flashScreen.style.backgroundColor = isFirstBeat ? '#ff0055' : '#ffcc00';
                    document.getElementById('info-overlay').innerHTML = `BEAT: ${currentBeatInMeasure}<br><span style="font-size:1.2rem">DISPOSITIVO ${currentPhone}</span>`;

                    if (lastBeatPlayed !== absoluteBeat) {
                        playClick(isFirstBeat ? 1200 : 800);
                        lastBeatPlayed = absoluteBeat;
                    }
                } else {
                    flashScreen.style.backgroundColor = '#111';
                    document.getElementById('info-overlay').innerHTML = `...<br><span style="font-size:1.2rem; color:#666;">In attesa (Beat ${currentBeatInMeasure})</span>`;
                }

                animationFrameId = requestAnimationFrame(updateLoop);
            }

            animationFrameId = requestAnimationFrame(updateLoop);
        }

        function stopMetronome() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('flash-screen').style.display = 'none';
            document.getElementById('setup-interface').style.display = 'block';
        }
    </script>
</body>
</html>
