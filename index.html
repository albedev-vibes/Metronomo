<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronomo Batucada Multi-Screen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #setup-interface {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 90%;
            text-align: center;
            z-index: 10;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        button:hover { background: #007c82; }

        /* Schermata Flash */
        #flash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.05s ease-out;
        }
        #info-overlay {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }
        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            font-size: 0.8rem;
            width: auto;
        }
    </style>
</head>
<body>

    <!-- INTERFACCIA DI CONFIGURAZIONE -->
    <div id="setup-interface">
        <h2>Configurazione</h2>

        <div class="control-group">
            <label>Ruolo di questo Telefono:</label>
            <select id="phone-id" onchange="checkRole()">
                <option value="regia">REGIA (Imposta i comandi)</option>
                <option value="1">Telefono 1 (Primo Beat -
Accento)</option>
                <option value="2">Telefono 2</option>
                <option value="3">Telefono 3</option>
                <option value="4">Telefono 4</option>
            </select>
        </div>

        <div id="regia-controls">
            <div class="control-group">
                <label>Tempo (Numeratore / Denominatore):</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="time-num" value="4"
min="1" max="16">
                    <span style="font-size: 1.5rem;">/</span>
                    <select id="time-den">
                        <option value="4">4</option>
                        <option value="8">8</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label>BPM (Velocità):</label>
                <input type="number" id="bpm" value="120" min="40"
max="300">
            </div>

            <div class="control-group">
                <label>Numero totale Telefoni in uso:</label>
                <input type="number" id="total-phones" value="2"
min="1" max="10">
            </div>
        </div>

        <button onclick="startMetronome()">AVVIA METRONOMO</button>
    </div>

    <!-- SCHERMATA DI LAMPEGGIAMENTO -->
    <div id="flash-screen">
        <button class="back-btn" onclick="stopMetronome()">⚙ Esci</button>
        <div id="info-overlay">Attendendo il tempo...</div>
    </div>

    <script>
        let timerInterval;

        // Controlla se mostrare i comandi di gestione o nasconderli
nei telefoni client
        function checkRole() {
            const role = document.getElementById('phone-id').value;
            const regiaControls =
document.getElementById('regia-controls');
            if (role === 'regia') {
                regiaControls.style.display = 'block';
            } else {
                regiaControls.style.display = 'none';
            }
        }

        function startMetronome() {
            const role = document.getElementById('phone-id').value;

            // Se è impostato su Regia, chiede quale numero di telefono
è questo specifico dispositivo
            if (role === 'regia') {
                alert("Per visualizzare i flash, imposta questo
telefono come 'Telefono 1' o 'Telefono 2' ecc. La Regia serve solo per
leggere i parametri da copiare sugli altri schermi.");
                return;
            }

            const currentPhone = parseInt(role);
            const num =
parseInt(document.getElementById('time-num').value);
            const bpm = parseInt(document.getElementById('bpm').value);
            const totalPhones =
parseInt(document.getElementById('total-phones').value);

            // Nascondi setup e mostra schermo flash
            document.getElementById('setup-interface').style.display =
'none';
            const flashScreen = document.getElementById('flash-screen');
            flashScreen.style.display = 'flex';
            flashScreen.style.backgroundColor = '#111';

            // Calcolo durata del singolo battito in millisecondi
            const beatDuration = (60 / bpm) * 1000;

            // Avvia il ciclo di controllo temporale continuo
            timerInterval = setInterval(() => {
                const now = Date.now();

                // Determina in quale battito assoluto ci troviamo
dall'inizio dei tempi Unix
                const absoluteBeat = Math.floor(now / beatDuration);

                // Trova la posizione del battito corrente all'interno
della battuta attuale (da 0 a num-1)
                const currentBeatInMeasure = (absoluteBeat % num) + 1;

                // Calcola quale telefono deve illuminarsi per questo
specifico battito
                let targetPhone = currentBeatInMeasure;

                // LOGICA DI ESTENSIONE: Se i battiti sono più dei
telefoni, l'ultimo telefono si prende i beat rimanenti
                if (currentBeatInMeasure > totalPhones) {
                    targetPhone = totalPhones;
                }

                // Verifica se questo telefono deve attivarsi
                if (currentPhone === targetPhone && currentPhone <=
totalPhones) {
                    // Colore Rosso per il Primo Beat, Giallo Luminoso
per gli altri beat
                    if (currentBeatInMeasure === 1) {
                        flashScreen.style.backgroundColor = '#ff0055';
// Rosso Accento
                    } else {
                        flashScreen.style.backgroundColor = '#ffcc00';
// Giallo Beat successivi
                    }
document.getElementById('info-overlay').innerHTML = `BEAT:
${currentBeatInMeasure}<br>TELEFONO: ${currentPhone}`;
                } else {
                    flashScreen.style.backgroundColor = '#111'; //
Schermo nero se spento o non tocca a lui
document.getElementById('info-overlay').innerHTML = `...<br><span
style="font-size:1rem; color:#444;">In attesa del Beat</span>`;
                }

                // Spegnimento rapido a metà battito per creare
l'effetto flash/impulso visivo netto
                setTimeout(() => {
                    if (flashScreen.style.backgroundColor !== 'rgb(17,
17, 17)') {
                        flashScreen.style.backgroundColor = '#111';
                    }
                }, beatDuration * 0.4);

            }, 40); // Controllo ogni 40 millisecondi per massima
precisione di calcolo
        }

        function stopMetronome() {
            clearInterval(timerInterval);
            document.getElementById('flash-screen').style.display = 'none';
            document.getElementById('setup-interface').style.display =
'block';
        }
    </script>
</body>
</html>
